<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    <title>VetAlmacén</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de escaneo por cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Cliente Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 text-slate-800 antialiased select-none md:select-auto">

    <!-- PANTALLA DE LOGIN POR PIN (Misma tabla usuarios_roles) -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 space-y-5">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-700 font-bold text-2xl mb-2">
                    <img src="./icons/icon.svg" alt="VetAlmacén" class="w-16 h-16 mx-auto mb-2 rounded-2xl shadow-md" />
                </div>
                <h1 class="text-2xl font-bold text-slate-900">VetAlmacén</h1>
                <p class="text-sm text-slate-500">Farmacia Veterinaria e Inventario</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Rancho / Almacén</label>
                    <select id="select-rancho" required class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:border-emerald-600 focus:outline-none">
            <option value="">Cargando ranchos...</option>
          </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">PIN de Acceso</label>
                    <input id="input-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" required class="w-full text-center tracking-widest text-2xl rounded-xl border border-slate-300 px-3 py-3 focus:border-emerald-600 focus:outline-none" />
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition">
          Entrar al Almacén
        </button>
            </form>
            <p id="login-error" class="text-center text-sm text-red-600 hidden"></p>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (Oculta hasta iniciar sesión) -->
    <div id="app-shell" class="hidden min-h-screen flex flex-col md:flex-row">

        <!-- SIDEBAR PARA PC (Oculto en móvil) -->
        <aside class="hidden md:flex md:w-64 md:flex-col bg-slate-900 text-white p-4 justify-between">
            <div>
                <div class="flex items-center gap-3 px-2 py-3 border-b border-slate-800">
                    <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold">VA</div>
                    <div>
                        <h2 class="font-bold leading-tight">VetAlmacén</h2>
                        <span id="pc-rancho-badge" class="text-xs text-emerald-400">Rancho</span>
                    </div>
                </div>

                <nav class="mt-6 space-y-1">
                    <button data-view="escaner" class="nav-btn w-full flex items-center gap-3 px-3 py-3 rounded-xl bg-emerald-600/20 text-emerald-400 font-medium">
            <span>📷</span> Escáner / Movimientos
          </button>
                    <button data-view="existencias" class="nav-btn w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-800 text-slate-300">
            <span>📦</span> Existencias y Lotes
          </button>
                    <button data-view="catalogo" class="nav-btn w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-800 text-slate-300">
            <span>💊</span> Alta / Catálogo
          </button>
                    <button data-view="sincronizacion" class="nav-btn w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-800 text-slate-300">
            <span>🔄</span> Exportar / Sincronizar
          </button>
                </nav>
            </div>

            <div class="border-t border-slate-800 pt-4 text-xs text-slate-400 flex items-center justify-between">
                <span id="pc-user-name">Usuario</span>
                <button id="btn-logout-pc" class="text-red-400 hover:underline">Salir</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 flex flex-col pb-20 md:pb-6">
            <!-- Header superior móvil -->
            <header class="md:hidden bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-20">
                <div>
                    <h1 class="font-bold text-lg leading-none">VetAlmacén</h1>
                    <span id="mob-rancho-badge" class="text-xs text-emerald-400">Rancho</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="mob-user-name" class="text-xs text-slate-300">Usuario</span>
                    <button id="btn-logout-mob" class="text-xs bg-slate-800 px-2.5 py-1.5 rounded-lg text-red-400">Salir</button>
                </div>
            </header>

            <!-- Contenedor dinámico de vistas -->
            <div id="view-container" class="p-4 md:p-8 max-w-6xl w-full mx-auto">
                <!-- Aquí js/ui.js inyecta la vista activa -->
            </div>
        </main>

        <!-- BARRA INFERIOR PARA MÓVIL (Oculta en PC) -->
        <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 grid grid-cols-4 py-1.5 z-20">
            <button data-view="escaner" class="nav-btn flex flex-col items-center py-1 text-emerald-600 font-semibold text-xs">
        <span class="text-xl">📷</span> Escanear
      </button>
            <button data-view="existencias" class="nav-btn flex flex-col items-center py-1 text-slate-500 text-xs">
        <span class="text-xl">📦</span> Stock
      </button>
            <button data-view="catalogo" class="nav-btn flex flex-col items-center py-1 text-slate-500 text-xs">
        <span class="text-xl">💊</span> Alta
      </button>
            <button data-view="sincronizacion" class="nav-btn flex flex-col items-center py-1 text-slate-500 text-xs">
        <span class="text-xl">🔄</span> Sync
      </button>
        </nav>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
